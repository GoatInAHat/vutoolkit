# Generated by toolfactory. Do not edit; run `toolfactory build` to regenerate.
# `gate` decides once which registries this tag can publish to (a job-level `if` cannot read
# secrets) and every leg obeys its output, so a tag with no secrets is still green: gate,
# package, the Release, and whatever else applies. After adding a secret, re-run with
# `gh workflow run release.yml -f tag=vX.Y.Z` — never `gh run rerun`, which replays the
# original run's secret snapshot. `release` first retracts every registry a surface dropped
# since the previous tag published to (git is the ledger; `toolfactory unpublish`), and
# `toolfactory secrets status` / `bootstrap-repo` cover the one-time steps that are left.
#
# None of Chrome Web Store, Firefox Add-ons or Edge Add-ons supports GitHub OIDC — like
# CLAWHUB_TOKEN above, publish-browser-ext is a stored-secrets leg, gated per store on that
# store's own secrets (nine names across the three stores); a store left unconfigured is
# skipped, never a failure, and the leg's own dry run runs on every push and pull request.
#
# Pages must be enabled with Source = GitHub Actions once (`toolfactory bootstrap-repo` does
# it through gh); until then the gate skips the Pages pair with a notice.

name: Release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: "The v* tag to release: an existing one to publish again (e.g. after adding a secret), or a new one to cut at this branch's head"
        required: true
        type: string
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TOOLFACTORY_SYSTEM_NATIVE_JOBS: "true"
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      npm: ${{ steps.presence.outputs.npm }}
      pages: ${{ steps.presence.outputs.pages }}
      chrome: ${{ steps.presence.outputs.chrome }}
      firefox: ${{ steps.presence.outputs.firefox }}
      edge: ${{ steps.presence.outputs.edge }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - id: tag
        name: the commit this tag releases
        run: sha=$(git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null || git rev-parse HEAD) && git checkout -q "$sha" && echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: tag matches plugin.json
        run: test "v$(node -p "require('./plugin.json').version")" = "$RELEASE_TAG"
      - name: install
        run: npm ci
      - name: build
        run: npm run --if-present build
      - name: toolfactory check
        run: npx toolfactory check
      - name: toolfactory build (output files)
        run: npx toolfactory build
      - name: Install Chromium dependencies
        run: npx --yes playwright install-deps chromium
      - name: toolfactory validate
        run: npx toolfactory validate
      - name: author checks
        run: npm run --if-present check
      - name: author tests
        run: npm test
      - name: author integration tests
        run: npm run --if-present test:integration
      - name: openclaw end-to-end (scripted model, no LLM key)
        run: npm --prefix hosts/openclaw run --if-present test:e2e
      - id: presence
        name: which registries this tag can publish to
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TRUSTED_PUBLISHER: ${{ vars.NPM_TRUSTED_PUBLISHER }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |-
          npm=false; if [ "$NPM_TRUSTED_PUBLISHER" = true ] || [ -n "$NPM_TOKEN" ]; then npm=true; else echo "::notice::npm: not published at this tag — https://www.npmjs.com/settings/~/tokens"; fi; echo "npm=$npm" >> "$GITHUB_OUTPUT"
          pages=false; if gh api repos/GoatInAHat/vutoolkit/pages >/dev/null 2>&1; then pages=true; else echo "::notice::pages: not published at this tag — https://github.com/GoatInAHat/vutoolkit/settings/pages"; fi; echo "pages=$pages" >> "$GITHUB_OUTPUT"
          chrome=false; if [ -n "$CHROME_EXTENSION_ID" ] && [ -n "$CHROME_PUBLISHER_ID" ] && [ -n "$CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL" ] && [ -n "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" ]; then chrome=true; else echo "::notice::chrome: not published at this tag — https://chrome.google.com/webstore/devconsole"; fi; echo "chrome=$chrome" >> "$GITHUB_OUTPUT"
          firefox=false; if [ -n "$FIREFOX_EXTENSION_ID" ] && [ -n "$FIREFOX_JWT_ISSUER" ] && [ -n "$FIREFOX_JWT_SECRET" ]; then firefox=true; else echo "::notice::firefox: not published at this tag — https://addons.mozilla.org/developers/addon/api/key/"; fi; echo "firefox=$firefox" >> "$GITHUB_OUTPUT"
          edge=false; if [ -n "$EDGE_PRODUCT_ID" ] && [ -n "$EDGE_CLIENT_ID" ] && [ -n "$EDGE_API_KEY" ]; then edge=true; else echo "::notice::edge: not published at this tag — https://partner.microsoft.com/dashboard/microsoftedge/publishapi"; fi; echo "edge=$edge" >> "$GITHUB_OUTPUT"
  package:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - name: release directory
        run: rm -rf dist/release && mkdir -p dist/release
      - name: install
        run: npm ci
      - name: build
        run: npm run --if-present build
      - name: toolfactory build (output files)
        run: npx toolfactory build
      - name: web build
        run: npm -C web ci && npm -C web run build
        env:
          PAGES_BASE: /
      - name: npm tarball
        run: npm pack --pack-destination dist/release
      - name: OpenClaw plugin tarball
        run: npm --prefix hosts/openclaw install && npm --prefix hosts/openclaw run build && npm pack ./hosts/openclaw --pack-destination dist/release
      - name: plugin bundle
        run: set -- skills; for path in LICENSE LICENSE.md LICENSE.txt NOTICE NOTICE.md NOTICE.txt; do if [ -f "$path" ]; then set -- "$@" "$path"; fi; done; zip -qr dist/release/vutoolkit-plugin.zip "$@"
      - name: web tarball
        run: tar -czf dist/release/vutoolkit-web.tar.gz -C web/dist .
      - name: browser extension zips
        run: npm --prefix hosts/browser install && npm --prefix hosts/browser exec --no -- wxt zip hosts/browser -b chrome && npm --prefix hosts/browser exec --no -- wxt zip hosts/browser -b firefox && npm --prefix hosts/browser exec --no -- wxt zip hosts/browser -b edge && cp hosts/browser/.output/vutoolkit-0.2.0-chrome.zip dist/release/ && cp hosts/browser/.output/vutoolkit-0.2.0-firefox.zip dist/release/ && cp hosts/browser/.output/vutoolkit-0.2.0-edge.zip dist/release/ && cp hosts/browser/.output/vutoolkit-0.2.0-sources.zip dist/release/
      - name: Firefox signed xpi (only when FIREFOX_JWT_ISSUER/FIREFOX_JWT_SECRET are set)
        run: if [ -n "$FIREFOX_JWT_ISSUER" ] && [ -n "$FIREFOX_JWT_SECRET" ]; then npm --prefix hosts/browser exec --no -- web-ext sign --channel=unlisted --api-key="$FIREFOX_JWT_ISSUER" --api-secret="$FIREFOX_JWT_SECRET" --source-dir hosts/browser/.output/firefox-mv2 --artifacts-dir dist/release; fi
      - name: coverage report
        run: cp COVERAGE.md dist/release/ && npx toolfactory coverage > dist/release/coverage.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/release/
  publish-npm:
    needs:
      - gate
      - package
    if: needs.gate.outputs.npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      NPM_TRUSTED_PUBLISHER: ${{ vars.NPM_TRUSTED_PUBLISHER }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - name: npm publish
        env:
          NPM_TOKEN: ${{ vars.NPM_TRUSTED_PUBLISHER != 'true' && secrets.NPM_TOKEN || '' }}
        run: 'if npm view vutoolkit@0.2.0 version >/dev/null 2>&1; then echo "::notice::npm: vutoolkit@0.2.0 already published; skipping immutable version."; elif [ "$NPM_TRUSTED_PUBLISHER" = true ]; then npm publish ./release-assets/vutoolkit-0.2.0.tgz --access public; else NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish ./release-assets/vutoolkit-0.2.0.tgz --access public; fi'
  publish-browser-ext:
    needs:
      - gate
      - package
    if: needs.gate.outputs.chrome == 'true' || needs.gate.outputs.firefox == 'true' || needs.gate.outputs.edge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CHROME_API_VERSION: v2
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
      CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
      FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm --prefix hosts/browser install
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - name: wxt submit --dry-run (zips, plus a live credential read for Chrome and Firefox)
        run: |-
          flags=""
          if [ -n "$CHROME_EXTENSION_ID" ] && [ -n "$CHROME_PUBLISHER_ID" ] && [ -n "$CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL" ] && [ -n "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" ]; then flags="$flags --chrome-zip release-assets/vutoolkit-0.2.0-chrome.zip"; fi
          if [ -n "$FIREFOX_EXTENSION_ID" ] && [ -n "$FIREFOX_JWT_ISSUER" ] && [ -n "$FIREFOX_JWT_SECRET" ]; then flags="$flags --firefox-zip release-assets/vutoolkit-0.2.0-firefox.zip --firefox-sources-zip release-assets/vutoolkit-0.2.0-sources.zip"; fi
          if [ -n "$EDGE_PRODUCT_ID" ] && [ -n "$EDGE_CLIENT_ID" ] && [ -n "$EDGE_API_KEY" ]; then flags="$flags --edge-zip release-assets/vutoolkit-0.2.0-edge.zip"; fi
          if [ -z "$flags" ]; then echo "No browser store credentials configured; skipping wxt submit."; exit 0; fi
          npm --prefix hosts/browser exec --no -- wxt submit --dry-run $flags
      - name: wxt submit
        run: |-
          flags=""
          if [ -n "$CHROME_EXTENSION_ID" ] && [ -n "$CHROME_PUBLISHER_ID" ] && [ -n "$CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL" ] && [ -n "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" ]; then flags="$flags --chrome-zip release-assets/vutoolkit-0.2.0-chrome.zip"; fi
          if [ -n "$FIREFOX_EXTENSION_ID" ] && [ -n "$FIREFOX_JWT_ISSUER" ] && [ -n "$FIREFOX_JWT_SECRET" ]; then flags="$flags --firefox-zip release-assets/vutoolkit-0.2.0-firefox.zip --firefox-sources-zip release-assets/vutoolkit-0.2.0-sources.zip"; fi
          if [ -n "$EDGE_PRODUCT_ID" ] && [ -n "$EDGE_CLIENT_ID" ] && [ -n "$EDGE_API_KEY" ]; then flags="$flags --edge-zip release-assets/vutoolkit-0.2.0-edge.zip"; fi
          if [ -z "$flags" ]; then echo "No browser store credentials configured; skipping wxt submit."; exit 0; fi
          npm --prefix hosts/browser exec --no -- wxt submit $flags
  release:
    needs:
      - gate
      - package
      - publish-npm
      - publish-browser-ext
    if: ${{ !cancelled() && needs.package.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - name: install
        run: npm ci
      - name: build
        run: npm run --if-present build
      - name: unpublish dropped registries
        run: npx toolfactory unpublish
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ needs.gate.outputs.sha }}
          generate_release_notes: true
          files: release-assets/**/*
          fail_on_unmatched_files: true
  pages-build:
    needs: gate
    if: needs.gate.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - name: install
        run: npm ci
      - name: build
        run: npm run --if-present build
      - name: toolfactory build (output files)
        run: npx toolfactory build
      - uses: actions/configure-pages@v5
      - name: web build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm -C web ci && npm -C web run build
      - name: publish the schema and the coverage report alongside the app
        run: cp dev.toolfactory/tool.schema.json COVERAGE.md web/dist/ && npx toolfactory coverage > web/dist/coverage.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
